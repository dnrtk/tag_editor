[package]
name = "tag_editor"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "5.0"
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trash = "5.2.5"
crc32fast = "1.3"
quick-xml = "0.29"
rayon = "1.10"
tiny_http = "0.12"
percent-encoding = "2.3"
webbrowser = "1.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
