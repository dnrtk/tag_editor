[package]
name = "tag_editor"
version = "0.1.0"
edition = "2021"

[features]
# The desktop GUI is on by default. A headless server build (e.g. for a
# Raspberry Pi / NAS container) is produced with `--no-default-features`, which
# drops eframe/winit/GTK and leaves only the pure-Rust web-server stack.
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:egui_extras", "dep:rfd", "dep:trash", "dep:webbrowser"]

[dependencies]
# Server core — always compiled, all pure Rust (no C/system libraries).
dirs = "5.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.3"
quick-xml = "0.29"
rayon = "1.10"
tiny_http = "0.12"
percent-encoding = "2.3"

# Desktop GUI only — pulled in by the `gui` feature. These carry the heavy
# windowing / GPU / GTK dependencies that we exclude from the headless build.
eframe = { version = "0.29", features = ["persistence"], optional = true }
egui = { version = "0.29", optional = true }
egui_extras = { version = "0.29", features = ["image", "file"], optional = true }
rfd = { version = "0.15", optional = true }
trash = { version = "5.2.5", optional = true }
webbrowser = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
